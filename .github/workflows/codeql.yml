name: codeql

# Static analysis (SAST) for Go. Alerts appear in the Security tab; the repository
# ruleset rule "code scanning results" blocks merges on high or critical alerts.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 5 * * 1'

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Runner architecture
        run: echo "runner arch=$(uname -m) os=${RUNNER_OS}"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go (latest patch of the go.mod minor, so stdlib fixes are picked up)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: go
          build-mode: manual
      # Manual build: Go's autobuild would find the Makefile and run `make`, whose default
      # target starts the podinfo server and never returns.
      - name: Build (observed by CodeQL)
        run: go build ./...
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:go
