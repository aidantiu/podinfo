name: release

# Runs only after a merge to main. Order is the policy:
#   build  -> push the linux/arm64 image to GHCR, output its digest
#   scan   -> Trivy on the PUSHED digest (fixable CRITICAL fails), write the SPDX SBOM
#   sign   -> only if scan passed: cosign keyless signature, SLSA provenance, SBOM attestation
# The signing identity is this file on main:
#   https://github.com/aidantiu/podinfo/.github/workflows/release.yml@refs/heads/main
# Renaming or moving the file changes the identity (see docs in platform-gitops).

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/aidantiu/podinfo
  TRIVY_VERSION: v0.76.1
  COSIGN_VERSION: v3.1.4

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      tag: ${{ steps.vars.outputs.tag }}
      image: ${{ steps.digest.outputs.image }}
    steps:
      - name: Runner architecture
        run: echo "runner arch=$(uname -m) os=${RUNNER_OS}"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute tag (sha-<first 8 of the commit>)
        id: vars
        run: echo "tag=sha-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push linux/arm64 (one manifest, no BuildKit attestations)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          provenance: false
          sbom: false
          build-args: |
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Record the pushed digest
        id: digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::unexpected digest '${DIGEST}'"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}:${TAG}@${DIGEST}" >> "$GITHUB_OUTPUT"
          {
            echo "### Pushed image"
            echo '```'
            echo "${IMAGE}:${TAG}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check the pushed object is a single linux/arm64 manifest
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          raw="$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}")"
          echo "$raw" | jq '{schemaVersion, mediaType, layers: (.layers | length)}'
          echo "$raw" | jq -e 'has("manifests") | not' > /dev/null

  scan:
    name: scan
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Runner architecture
        run: echo "runner arch=$(uname -m) os=${RUNNER_OS}"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy gate on the pushed digest (fixable CRITICAL fails)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          format: table
      - name: SPDX SBOM of the pushed digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          skip-setup-trivy: true
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
          format: spdx-json
          output: sbom.spdx.json
          exit-code: '0'
      - name: Keep the SBOM (workflow artifact, 90 days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 90
          if-no-files-found: error

  sign:
    name: sign
    needs: [build, scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only GitHub- and Sigstore-owned actions run here: this job can mint the OIDC token.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
      IDENTITY: https://github.com/aidantiu/podinfo/.github/workflows/release.yml@refs/heads/main
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Runner architecture
        run: echo "runner arch=$(uname -m) os=${RUNNER_OS}"
      - name: Fetch the SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-spdx
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Log in to GHCR (cosign and the attest action read the Docker config)
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | cosign login ghcr.io --username "$ACTOR" --password-stdin
      - name: Sign the digest (keyless)
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Verify the signature with the published identity
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER"
      - name: Attest SLSA build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
      - name: Attest the SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
      - name: Verify the provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
      - name: Result
        env:
          FULL_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          {
            echo "### Signed image"
            echo '```'
            echo "$FULL_IMAGE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
