# Local gates, same tools as CI (docs: SECURITY-PIPELINE.md).
# Install once:  brew install pre-commit hadolint && pre-commit install
# Run on demand: pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # v1.38.0
    hooks:
      - id: yamllint
        files: ^(\.github/|\.pre-commit-config\.yaml|\.trivyignore\.yaml|\.yamllint\.yaml)

  - repo: local
    hooks:
      - id: hadolint
        name: hadolint (fails on level error)
        entry: hadolint --failure-threshold error
        language: system
        files: (^|/)Dockerfile[^/]*$
      - id: gofmt
        name: gofmt
        entry: bash -c 'out=$(gofmt -l .); if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi'
        language: system
        types: [go]
        pass_filenames: false
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false
      - id: trivyignore-valid
        name: .trivyignore.yaml is valid (needs yq)
        entry: python3 .github/scripts/check-trivyignore.py .trivyignore.yaml
        language: system
        files: ^\.trivyignore\.yaml$
        pass_filenames: false
